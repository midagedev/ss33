name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt drift; run 'gofmt -w' on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Go tests
        run: go test ./...

      - name: Docker build
        run: docker build -t ss33:local .

      - name: Container smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ss33 -p 9000:9000 -e MINIO_ROOT_USER=admin -e MINIO_ROOT_PASSWORD=admin-secret ss33:local server /data --console-address :9001
          for _ in {1..30}; do curl -fsS http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          docker run --rm --network host --entrypoint /bin/sh ss33:local -c '
            set -e
            mc alias set local http://127.0.0.1:9000 admin admin-secret
            mc mb --ignore-existing local/smoke
            echo hello > /tmp/hello.txt
            mc cp /tmp/hello.txt local/smoke/hello.txt
            mc ls local/smoke | grep -q hello.txt'
